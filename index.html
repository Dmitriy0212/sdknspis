<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .wrapper {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;
      }

      .image {
        width: 400%;
        height: 400%;

        object-fit: cover;
        transform-origin: center center;

        animation: rotate 13s linear infinite;
        transition: all 1s ease-in-out;
      }

      @keyframes rotate {
        0% {
          transition: all 1s ease-in-out;
          transform: rotate(0deg);
        }

        100% {
          transition: all 1s ease-in-out;
          transform: rotate(359deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <img class="image" src="./photo_2026-10-01_15-27-56.jpg" alt="" />
    </div>
  </body>
</html>
